name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # package.json의 packageManager 버전을 설치하고 pnpm store를 캐시한다
      - uses: pnpm/action-setup@v6.1.0
        with:
          cache: true

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Test
        run: pnpm test:ci

      - name: Build
        run: pnpm build
        env:
          # lint 단계에서 이미 검사했으므로 빌드 중 ESLint 플러그인은 끈다
          DISABLE_ESLINT_PLUGIN: "true"
